# CI: fmt + clippy, tests en Ubuntu/macOS; cobertura de líneas ≥ 95 % (excluye solo src/main.rs del cómputo).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Raíz del crate
        id: crate
        run: |
          if [ -f hive_core/Cargo.toml ]; then echo "root=hive_core" >> "$GITHUB_OUTPUT"
          else echo "root=." >> "$GITHUB_OUTPUT"
          fi
      - name: cargo test (macOS, Xcode / clang)
        working-directory: ${{ steps.crate.outputs.root }}
        run: cargo test --verbose

  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Raíz del crate
        id: crate
        run: |
          if [ -f hive_core/Cargo.toml ]; then echo "root=hive_core" >> "$GITHUB_OUTPUT"
          else echo "root=." >> "$GITHUB_OUTPUT"
          fi

      - name: Toolchain estable + llvm-tools (llvm-cov)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Dependencias del sistema (libgit2, SSL, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev libssl-dev pkg-config cmake llvm

      - name: cargo fmt (--check)
        working-directory: ${{ steps.crate.outputs.root }}
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        working-directory: ${{ steps.crate.outputs.root }}
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: ${{ steps.crate.outputs.root }}
        run: cargo test --verbose

      # Solo excluye el binario (main.rs); el resto del crate debe cubrirse ≥ 95 % líneas.
      - name: Cobertura de líneas (≥ 95 %)
        working-directory: ${{ steps.crate.outputs.root }}
        run: |
          cargo llvm-cov test \
            --fail-under-lines 95 \
            --ignore-filename-regex '^(.*/)?src/main\.rs$' \
            --summary-only \
            --color always
