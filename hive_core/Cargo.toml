[package]
name = "hive_core"
version = "0.1.0"
edition = "2021"

# Umbral alineado con CI: `cargo llvm-cov test --fail-under-lines 95` y exclusión de main/sequential_merger/worktree_manager.
[package.metadata.cargo-llvm-cov]
fail-under-lines = 95

[features]
default = []
multiagent = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
