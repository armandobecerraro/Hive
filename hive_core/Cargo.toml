[package]
name = "hive_core"
version = "0.1.0"
edition = "2021"

# Umbral alineado con CI: cobertura de líneas en `src/` (solo excluye `main.rs` del informe).
[package.metadata.cargo-llvm-cov]
fail-under-lines = 94

[features]
default = []
multiagent = ["dep:reqwest", "dep:bollard", "dep:octocrab", "dep:opentelemetry",
              "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry",
              "dep:petgraph", "dep:tokio-tungstenite", "dep:tungstenite",
              "dep:tree-sitter", "dep:notify"]
full = ["multiagent"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
thiserror = "2"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"], optional = true }

# Sandbox Docker
bollard = { version = "0.18", optional = true }

# GitHub API
octocrab = { version = "0.42", optional = true }

# OpenTelemetry observabilidad
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", optional = true, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }

# DAG de tareas
petgraph = { version = "0.7", optional = true }

# WebSocket pair programming
tokio-tungstenite = { version = "0.26", optional = true }
tungstenite = { version = "0.26", optional = true }

# AST code analysis
tree-sitter = { version = "0.24", optional = true }

# File system watcher
notify = { version = "7.0", optional = true }

# Utilidades async
futures-util = "0.3"
# Diff/patch
similar = "2.6"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
