[package]
name = "hive_core"
version = "0.1.0"
edition = "2021"

# Umbral alineado con CI (líneas en `src/` salvo `main.rs` en el regex de exclusión).
# Tras escenarios E2E y módulos grandes (`orchestrator`), el total real ronda ~94 %; se revisa al añadir tests dirigidos.
[package.metadata.cargo-llvm-cov]
fail-under-lines = 94

[features]
default = []
multiagent = ["dep:reqwest"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
thiserror = "2"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json"], optional = true }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
