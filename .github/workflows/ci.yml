# CI en la raíz del repo (GitHub solo ejecuta workflows desde /.github).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  hive-core-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hive_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hive_core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: cargo fmt (--check)
        working-directory: hive_core
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        working-directory: hive_core
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: hive_core
        run: cargo test --verbose
      - name: cargo test --features multiagent
        working-directory: hive_core
        run: cargo test --verbose --features multiagent

  hive-core-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hive_core/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hive_core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Dependencias del sistema (libgit2, SSL, LLVM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev libssl-dev pkg-config cmake llvm

      - name: cargo fmt (--check)
        working-directory: hive_core
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        working-directory: hive_core
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: hive_core
        run: cargo test --verbose

      - name: cargo test --features multiagent
        working-directory: hive_core
        run: cargo test --verbose --features multiagent

      - name: Cobertura de líneas (≥ 85 %)
        working-directory: hive_core
        run: |
          cargo llvm-cov test \
            --fail-under-lines 85 \
            --ignore-filename-regex '^(.*/)?src/main\.rs$' \
            --summary-only \
            --color always

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: hive_core

  # SBOM CycloneDX (NTIA / cadena de suministro); artefactos descargables desde la ejecución del workflow.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SYFT_VERSION: v1.18.0
    steps:
      - uses: actions/checkout@v6

      - name: Instalar Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin "${SYFT_VERSION}"
          syft version

      - name: Generar SBOM (CycloneDX JSON)
        run: |
          mkdir -p sbom
          # Excluir artefactos de build: en PRs con cache, hive_core/target puede ser muy grande.
          syft scan hive_core \
            -o cyclonedx-json=sbom/sbom-hive-core.cdx.json \
            --exclude '**/target/**'
          syft scan editors/vscode-hive \
            -o cyclonedx-json=sbom/sbom-vscode-hive.cdx.json \
            --exclude '**/node_modules/**' \
            --exclude '**/out/**'

      - name: Subir artefactos SBOM
        uses: actions/upload-artifact@v5
        with:
          name: sbom-cyclonedx
          path: |
            sbom/sbom-hive-core.cdx.json
            sbom/sbom-vscode-hive.cdx.json
          if-no-files-found: error

  vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editors/vscode-hive/package-lock.json

      - name: Compilar y probar extensión
        working-directory: editors/vscode-hive
        run: |
          npm ci
          npm run compile
          npm test

      - name: npm audit
        working-directory: editors/vscode-hive
        run: npm audit --production
